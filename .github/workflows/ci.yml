name: Port Control CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-control-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install baseline validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Run tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run COR-12 browser smoke
        run: npm run test:browser

      - name: Check commit whitespace
        run: git diff --check HEAD^ HEAD

      - name: Validate frozen baseline
        working-directory: Port_Control_Baseline_Source_FINAL_v1.5
        run: python tools/validate_baseline.py .

      - name: Validate localization
        working-directory: Port_Control_Baseline_Source_FINAL_v1.5
        run: python tools/validate_localization.py .

      - name: Validate semantic round-trip
        working-directory: Port_Control_Baseline_Source_FINAL_v1.5
        run: python tools/semantic_roundtrip.py .

      - name: Validate assets
        working-directory: Port_Control_Baseline_Source_FINAL_v1.5
        run: python tools/validate_assets.py .
